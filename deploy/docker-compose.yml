# 酒店客房预订系统 一键编排（frontend + app + mysql + redis）
# 使用：cp .env.example .env（修改口令）后  docker compose up -d --build
# 首次启动 MySQL 数据卷为空时，会自动执行挂载到 /docker-entrypoint-initdb.d 的 schema/seed 脚本。
services:

  mysql:
    image: mysql:8.0
    container_name: hotel-mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123456}
      MYSQL_DATABASE: hotel_booking
      MYSQL_USER: ${MYSQL_USER:-hotel}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-hotel123456}
      TZ: Asia/Shanghai
    volumes:
      - mysql-data:/var/lib/mysql
      # 仅首次初始化时自动执行（顺序按文件名）
      - ../database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ../database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-root123456}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    # 不对外暴露端口，仅 compose 内网可达

  redis:
    image: redis:7-alpine
    container_name: hotel-redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-redis123456}"]
    restart: unless-stopped
    # 预留：当前 MVP 应用尚未强依赖 Redis，后续用于令牌/缓存/分布式锁

  app:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: hotel-app
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/hotel_booking?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-hotel}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-hotel123456}
      APP_JWT_SECRET: ${APP_JWT_SECRET:-please-change-this-jwt-secret}
      TZ: Asia/Shanghai
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    expose:
      - "8080"

  frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    container_name: hotel-frontend
    ports:
      - "80:80"
    depends_on:
      - app
    restart: unless-stopped

volumes:
  mysql-data:
