services:
  - type: web
    name: hotel-booking-api-3709384
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./backend/Dockerfile.railway
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: APP_JWT_SECRET
        generateValue: true
      - key: APP_CORS_ALLOWED_ORIGINS
        value: https://hotel-booking-web-3709384.onrender.com

  - type: web
    name: hotel-booking-web-3709384
    runtime: static
    plan: free
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://hotel-booking-api-3709384.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
