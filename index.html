<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>云栖酒店 · 预订系统（全功能单文件演示）</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; background:#8FC7DC; color:#173F52; min-height:100vh; }
  a { color:#2F7EA3; text-decoration:none; }
  header { position:sticky; top:0; z-index:50; background:rgba(255,255,255,.94); backdrop-filter:blur(6px); box-shadow:0 2px 14px rgba(47,126,163,.15); }
  .head-in { max-width:1180px; margin:0 auto; padding:12px 16px; display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
  .logo { font-size:20px; font-weight:800; color:#2F7EA3; }
  .logo small { display:block; font-size:11px; font-weight:500; color:#7AA8BC; }
  nav { display:flex; gap:8px; flex-wrap:wrap; margin-left:auto; }
  .nav-btn { border:2px solid #BFE0EE; background:#fff; color:#2F7EA3; padding:7px 14px; border-radius:999px; font-size:14px; cursor:pointer; font-weight:600; }
  .nav-btn.active { background:#E1F0F6; border-color:#4E9DBE; }
  .user-box { display:flex; align-items:center; gap:8px; font-size:14px; }
  main { max-width:1180px; margin:0 auto; padding:20px 16px 60px; }
  .card { background:#fff; border-radius:24px; padding:22px; margin-bottom:18px; }
  .card h2 { color:#2F7EA3; font-size:20px; margin-bottom:12px; }
  .card h3 { color:#2F7EA3; font-size:16px; margin:14px 0 8px; }
  .btn { display:inline-block; border:none; background:#3D8CAE; color:#fff; padding:10px 20px; border-radius:999px; font-size:15px; cursor:pointer; font-weight:600; }
  .btn:hover { background:#2F7EA3; }
  .btn:disabled { background:#B9D6E2; cursor:not-allowed; }
  .btn.light { background:#E1F0F6; color:#2F7EA3; }
  .btn.light:hover { background:#CFE8F2; }
  .btn.danger { background:#E2703A; }
  .btn.small { padding:6px 14px; font-size:13px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); gap:18px; }
  .room-card { background:#fff; border-radius:24px; overflow:hidden; display:flex; flex-direction:column; }
  .room-cover { height:130px; display:flex; align-items:center; justify-content:center; font-size:54px; color:#fff; }
  .g1{background:linear-gradient(135deg,#4E9DBE,#8FC7DC)} .g2{background:linear-gradient(135deg,#F2A65A,#E2703A)}
  .g3{background:linear-gradient(135deg,#5B8C5A,#8FC7DC)} .g4{background:linear-gradient(135deg,#7C6AAE,#4E9DBE)}
  .g5{background:linear-gradient(135deg,#C96F8E,#F2A65A)} .g6{background:linear-gradient(135deg,#2F7EA3,#5B8C5A)}
  .room-body { padding:18px; display:flex; flex-direction:column; gap:8px; flex:1; }
  .room-body h3 { font-size:18px; color:#2F7EA3; }
  .specs { font-size:13px; color:#5B7E8E; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; }
  .chip { background:#EFF7FA; color:#2F7EA3; font-size:12px; padding:3px 10px; border-radius:999px; }
  .price-row { margin-top:auto; display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; }
  .price { font-size:24px; font-weight:800; color:#E2703A; }
  .price small { font-size:13px; color:#5B7E8E; font-weight:500; }
  .badge { display:inline-block; font-size:12px; font-weight:700; padding:3px 10px; border-radius:999px; }
  .b-ok { background:#E3F4E5; color:#357A38; } .b-warn { background:#FDF0DC; color:#A86A12; }
  .b-bad { background:#FBE3E3; color:#B03A3A; } .b-info { background:#E1F0F6; color:#2F7EA3; }
  .b-grey { background:#EDF1F3; color:#607B88; }
  .search-bar { display:flex; gap:10px; flex-wrap:wrap; align-items:end; }
  .field { display:flex; flex-direction:column; gap:5px; font-size:13px; color:#5B7E8E; font-weight:600; }
  .field input, .field select, .field textarea { border:2px solid #D6EAF2; border-radius:12px; padding:9px 12px; font-size:15px; color:#173F52; background:#fff; font-family:inherit; }
  .field input:focus, .field select:focus, .field textarea:focus { outline:none; border-color:#4E9DBE; }
  .form-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:14px; }

  .order-no { font-weight:700; color:#2F7EA3; }
  .muted { color:#7AA8BC; font-size:13px; }
  .actions { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
  .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:14px; }
  .stat { background:#EFF7FA; border-radius:18px; padding:16px; text-align:center; }
  .stat .num { font-size:28px; font-weight:800; color:#2F7EA3; }
  .stat .lbl { font-size:13px; color:#5B7E8E; margin-top:4px; }
  .board { display:grid; grid-template-columns:repeat(auto-fill,minmax(108px,1fr)); gap:10px; }
  .cell { border-radius:14px; padding:10px; text-align:center; cursor:pointer; border:2px solid transparent; }
  .cell .no { font-weight:800; font-size:16px; }
  .cell .st { font-size:12px; margin-top:2px; }

  .st-DIRTY { background:#FDF0DC; color:#8F5E0E; } .st-MAINTENANCE { background:#E8E4F2; color:#57468A; }
  .tabs { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; }

  .tab.active { background:#E1F0F6; border-color:#4E9DBE; }
  .modal-mask { position:fixed; inset:0; background:rgba(23,63,82,.45); display:none; align-items:center; justify-content:center; z-index:100; padding:16px; }

  #toast { position:fixed; left:50%; bottom:28px; transform:translateX(-50%) translateY(20px); background:#173F52; color:#fff; padding:12px 22px; border-radius:999px; font-size:15px; opacity:0; pointer-events:none; transition:.25s; z-index:200; max-width:90vw; text-align:center; }
  .timeline { display:flex; gap:6px; flex-wrap:wrap; align-items:center; font-size:13px; margin:10px 0; }
  .tl-dot { background:#EDF1F3; color:#607B88; border-radius:999px; padding:4px 12px; font-weight:600; }
  .tl-dot.on { background:#3D8CAE; color:#fff; }
  .tl-arrow { color:#B9D6E2; }
  .review { border-bottom:1px solid #EAF3F7; padding:10px 0; }
  .stars { color:#F2A65A; letter-spacing:2px; }
  .auth-wrap { max-width:440px; margin:30px auto; }
  .quick { display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
  .note { background:#FDF6E9; border-radius:14px; padding:12px 14px; font-size:13px; color:#7A5A17; margin-bottom:14px; line-height:1.6; }
  .kv { display:grid; grid-template-columns:110px 1fr; gap:6px 12px; font-size:14px; }
  .kv dt { color:#7AA8BC; } .kv dd { font-weight:600; }
  @media (max-width:640px){ .room-cover{height:100px} .card{padding:16px} }
</style>

<body>
<header>
  <div class="head-in">
    <div class="logo">🏨 云栖酒店<small>预订系统 · 全功能单文件演示版</small></div>
    <nav id="nav"></nav>
    <div class="user-box" id="userBox"></div>
  </div>
</header>
<main id="app"></main>
<div class="modal-mask" id="modalMask"><div class="modal" id="modalBox"></div></div>
<div id="toast"></div>

<script>
"use strict";
/* ============ 工具 ============ */
const $ = s => document.querySelector(s);
const todayStr = (offset=0) => { const d=new Date(); d.setDate(d.getDate()+offset); return d.toISOString().slice(0,10); };
const nightsBetween = (a,b) => Math.round((new Date(b)-new Date(a))/86400000);
const nightList = (a,b) => { const r=[]; let d=new Date(a); const end=new Date(b); while(d<end){ r.push(d.toISOString().slice(0,10)); d.setDate(d.getDate()+1);} return r; };
const money = n => "¥" + Number(n).toLocaleString("zh-CN");
const esc = s => String(s??"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.style.opacity=1; t.style.transform="translateX(-50%)"; setTimeout(()=>{ t.style.opacity=0; t.style.transform="translateX(-50%) translateY(20px)"; },2600); }
function openModal(html){ $("#modalBox").innerHTML=html; $("#modalMask").classList.add("show"); }
function closeModal(){ $("#modalMask").classList.remove("show"); }
$("#modalMask").addEventListener("click", e=>{ if(e.target.id==="modalMask") closeModal(); });

/* ============ 种子数据（与仓库 seed.sql 同结构：用户/房型/房间/订单/支付/点评） ============ */
const PAY_MINUTES = 15; // 待支付订单超时分钟数，对应后端 OrderTimeoutJob
function seedData(){
  const users = [
    { id:"u-admin", username:"admin", password:"admin123", name:"系统管理员", phone:"13800000001", role:"ADMIN" },
    { id:"u-staff", username:"staff", password:"staff123", name:"前台小张", phone:"13800000002", role:"STAFF" },
    { id:"u-guest", username:"guest", password:"user123", name:"演示客人", phone:"13800000003", role:"USER" },
    { id:"u-li", username:"liwei", password:"user123", name:"李伟", phone:"13911112222", role:"USER" },
    { id:"u-wang", username:"wangfang", password:"user123", name:"王芳", phone:"13733334444", role:"USER" }
  ];
  const roomTypes = [
    { id:"rt1", name:"标准双床房", price:299, totalRooms:6, capacity:2, area:32, bed:"1.2m 双床", grade:"g1", icon:"🛏️", amenities:["免费WiFi","空调","电视","独立卫浴"], desc:"温馨实用，适合朋友结伴或出差双人入住。", active:true },
    { id:"rt2", name:"豪华大床房", price:399, totalRooms:5, capacity:2, area:38, bed:"1.8m 大床", grade:"g2", icon:"🛎️", amenities:["免费WiFi","空调","浴缸","迷你吧"], desc:"落地窗采光，带浴缸，情侣和商务客人的热门选择。", active:true },
    { id:"rt3", name:"商务大床房", price:459, totalRooms:4, capacity:2, area:42, bed:"1.8m 大床", grade:"g3", icon:"💼", amenities:["办公桌","免费WiFi","咖啡机","洗衣服务"], desc:"安静楼层 + 独立办公区，出差办公不将就。", active:true },
    { id:"rt4", name:"海景大床房", price:699, totalRooms:3, capacity:2, area:45, bed:"1.8m 大床", grade:"g6", icon:"🌊", amenities:["海景阳台","浴缸","早餐","迷你吧"], desc:"推窗见海，含双早，度假首选。", active:true },
    { id:"rt5", name:"家庭套房", price:599, totalRooms:3, capacity:4, area:68, bed:"大床+双床", grade:"g4", icon:"👨‍👩‍👧", amenities:["客厅","双卫浴","儿童用品","早餐"], desc:"一厅一卧，全家出游空间管够。", active:true },
    { id:"rt6", name:"行政套房", price:899, totalRooms:2, capacity:3, area:88, bed:"2m 大床", grade:"g5", icon:"👑", amenities:["行政酒廊","会客区","浴缸","管家服务"], desc:"顶层套房，含行政酒廊权益，接待贵宾有面子。", active:true }
  ];
  const rooms = [];
  const floors = { rt1:2, rt2:3, rt3:5, rt4:6, rt5:7, rt6:8 };
  roomTypes.forEach(rt=>{
    for(let i=1;i<=rt.totalRooms;i++){
      rooms.push({ id:"room-"+rt.id+"-"+i, roomTypeId:rt.id, number: floors[rt.id]*100 + i, status:"VACANT" });
    }
  });
  rooms.find(r=>r.id==="room-rt4-1").status = "OCCUPIED"; // 与种子订单 r-seed-4 的已入住房间对应（601 房）
  rooms.find(r=>r.number===202).status = "DIRTY";
  rooms.find(r=>r.number===501).status = "MAINTENANCE";
  const now = Date.now();
  const reservations = [
    { id:"r-seed-1", orderNo:"HB20261029001", userId:"u-guest", guestName:"演示客人", guestPhone:"13800000003",
      items:[{ roomTypeId:"rt2", rooms:1, price:399 }], checkIn:todayStr(0), checkOut:todayStr(2), totalAmount:798,
      status:"PAID", createdAt:now-3600e3, paidAt:now-3500e3, assignedRoomId:null, remark:"高楼层，安静一点" },
    { id:"r-seed-2", orderNo:"HB20261029002", userId:"u-guest", guestName:"演示客人", guestPhone:"13800000003",
      items:[{ roomTypeId:"rt1", rooms:1, price:299 }], checkIn:todayStr(3), checkOut:todayStr(4), totalAmount:299,
      status:"UNPAID", createdAt:now-120e3, paidAt:null, assignedRoomId:null, remark:"" },
    { id:"r-seed-3", orderNo:"HB20261020003", userId:"u-guest", guestName:"演示客人", guestPhone:"13800000003",
      items:[{ roomTypeId:"rt4", rooms:1, price:699 }], checkIn:todayStr(-6), checkOut:todayStr(-4), totalAmount:1398,
      status:"COMPLETED", createdAt:now-7*86400e3, paidAt:now-7*86400e3, assignedRoomId:"room-rt4-2", remark:"" },
    { id:"r-seed-4", orderNo:"HB20261029004", userId:"u-wang", guestName:"王芳", guestPhone:"13733334444",
      items:[{ roomTypeId:"rt4", rooms:1, price:699 }], checkIn:todayStr(-1), checkOut:todayStr(1), totalAmount:1398,
      status:"CHECKED_IN", createdAt:now-2*86400e3, paidAt:now-2*86400e3, assignedRoomId:"room-rt4-1", remark:"" },
    { id:"r-seed-5", orderNo:"HB20261029005", userId:"u-li", guestName:"李伟", guestPhone:"13911112222",
      items:[{ roomTypeId:"rt1", rooms:2, price:299 }], checkIn:todayStr(0), checkOut:todayStr(1), totalAmount:598,
      status:"PAID", createdAt:now-5*3600e3, paidAt:now-5*3600e3, assignedRoomId:null, remark:"两间尽量挨着" }
  ];
  const payments = [
    { id:"p1", reservationId:"r-seed-1", amount:798, method:"微信支付", status:"SUCCESS", tradeNo:"WX"+now, paidAt:now-3500e3 },
    { id:"p2", reservationId:"r-seed-3", amount:1398, method:"支付宝", status:"SUCCESS", tradeNo:"ALI"+(now-7*86400e3), paidAt:now-7*86400e3 },
    { id:"p3", reservationId:"r-seed-4", amount:1398, method:"微信支付", status:"SUCCESS", tradeNo:"WX"+(now-2*86400e3), paidAt:now-2*86400e3 },
    { id:"p4", reservationId:"r-seed-5", amount:598, method:"银行卡", status:"SUCCESS", tradeNo:"CARD"+(now-5*3600e3), paidAt:now-5*3600e3 }
  ];
  const reviews = [
    { id:"rev1", roomTypeId:"rt4", userId:"u-guest", userName:"演示客人", rating:5, content:"阳台看海太值了，早餐也丰盛，下次还住。", date:todayStr(-3), reservationId:"r-seed-3" },
    { id:"rev2", roomTypeId:"rt2", userId:"u-li", userName:"李伟", rating:5, content:"床很舒服，浴缸泡澡解乏，前台服务也热情。", date:todayStr(-9), reservationId:null },
    { id:"rev3", roomTypeId:"rt2", userId:"u-wang", userName:"王芳", rating:4, content:"整体不错，隔音稍差一点，但位置和服务都好。", date:todayStr(-12), reservationId:null },
    { id:"rev4", roomTypeId:"rt1", userId:"u-li", userName:"李伟", rating:4, content:"性价比高，房间干净，出差住完全够用。", date:todayStr(-15), reservationId:null }
  ];
  return { users, roomTypes, rooms, reservations, payments, reviews, orderSeq:1006 };
}

/* ============ 状态存取（localStorage 代替后端 MySQL，结构与仓库一致） ============ */
const DB_KEY = "hotel-booking-demo-v1", SES_KEY = "hotel-booking-demo-session";
let DB;
try { DB = JSON.parse(localStorage.getItem(DB_KEY)) || seedData(); } catch(e){ DB = seedData(); }
function save(){ localStorage.setItem(DB_KEY, JSON.stringify(DB)); }
save();
let sessionUserId = localStorage.getItem(SES_KEY) || null;
const me = () => DB.users.find(u=>u.id===sessionUserId) || null;
function setSession(id){ sessionUserId = id; if(id) localStorage.setItem(SES_KEY,id); else localStorage.removeItem(SES_KEY); }

const STATUS = {
  UNPAID:{ t:"待支付", cls:"b-warn" }, PAID:{ t:"已支付 · 待入住", cls:"b-info" },
  CHECKED_IN:{ t:"已入住", cls:"b-ok" }, COMPLETED:{ t:"已完成", cls:"b-grey" },
  CANCELLED:{ t:"已取消", cls:"b-bad" }, EXPIRED:{ t:"超时取消", cls:"b-bad" }
};
const ROOM_STATUS = { VACANT:"空净", OCCUPIED:"在住", DIRTY:"空脏待清洁", MAINTENANCE:"维修中" };
const rtById = id => DB.roomTypes.find(r=>r.id===id);
const roomById = id => DB.rooms.find(r=>r.id===id);
const resById = id => DB.reservations.find(r=>r.id===id);
const userById = id => DB.users.find(u=>u.id===id);

/* 订单超时自动取消（对应后端 OrderTimeoutJob 定时任务） */
function expireOrders(){
  const now = Date.now(); let changed = false;
  DB.reservations.forEach(r=>{
    if(r.status==="UNPAID" && now - r.createdAt > PAY_MINUTES*60*1000){ r.status="EXPIRED"; changed=true; }
  });
  if(changed) save();
}
/* 按晚库存：某房型在日期区间内每晚的剩余量取最小值 —— 防超卖核心口径 */
function bookedOn(roomTypeId, night, excludeId){
  return DB.reservations.filter(r => r.id!==excludeId && ["UNPAID","PAID","CHECKED_IN"].includes(r.status)
    && r.checkIn <= night && night < r.checkOut)
    .reduce((sum,r)=> sum + r.items.filter(it=>it.roomTypeId===roomTypeId).reduce((s,it)=>s+it.rooms,0), 0);
}
function availability(roomTypeId, checkIn, checkOut, excludeId){
  const rt = rtById(roomTypeId); if(!rt) return 0;
  const ns = nightList(checkIn, checkOut); if(!ns.length) return 0;
  return Math.min(...ns.map(n => rt.totalRooms - bookedOn(roomTypeId, n, excludeId)));
}
function reviewSummary(roomTypeId){
  const rs = DB.reviews.filter(r=>r.roomTypeId===roomTypeId);
  if(!rs.length) return { avg:0, count:0 };
  return { avg:(rs.reduce((s,r)=>s+r.rating,0)/rs.length).toFixed(1), count:rs.length };
}
function canReview(res){
  return res.status==="COMPLETED" && !DB.reviews.some(r=>r.reservationId===res.id);
}
</script>
<script>
/* ============ 导航与路由 ============ */
let view = "rooms";
let viewParam = null;
let search = { checkIn: todayStr(0), checkOut: todayStr(1), guests: 2, kw: "" };
let bookingDraft = { roomTypeId: null, checkIn: todayStr(0), checkOut: todayStr(1), rooms: 1 };
let orderFilter = "ALL";

function go(v, param){ view = v; viewParam = param ?? null; expireOrders(); render(); window.scrollTo(0,0); }
function renderNav(){
  const u = me();
  const items = [ ["rooms","🏠 房型预订"], ["orders","🧾 我的订单"] ];
  if(u && (u.role==="STAFF" || u.role==="ADMIN")) items.push(["pms","🛎️ 前台 PMS"]);
  if(u && u.role==="ADMIN") items.push(["admin","⚙️ 管理后台"]);
  $("#nav").innerHTML = items.map(([v,t]) =>
    `<button class="nav-btn ${view===v?'active':''}" onclick="go('${v}')">${t}</button>`).join("");
  $("#userBox").innerHTML = u
    ? `<span>👤 ${esc(u.name)} <span class="badge b-info">${{USER:"普通用户",STAFF:"前台",ADMIN:"管理员"}[u.role]}</span></span>
       <button class="nav-btn" onclick="logout()">退出</button>
       <button class="nav-btn" title="恢复初始演示数据" onclick="resetData()">↺ 重置数据</button>`
    : `<button class="nav-btn" onclick="go('login')">登录</button><button class="nav-btn" onclick="go('register')">注册</button>
       <button class="nav-btn" title="恢复初始演示数据" onclick="resetData()">↺ 重置数据</button>`;
}
function render(){
  renderNav();
  const app = $("#app");
  if(view==="rooms") app.innerHTML = viewRooms();
  else if(view==="detail") app.innerHTML = viewDetail(viewParam);
  else if(view==="booking") app.innerHTML = viewBooking();
  else if(view==="orders") app.innerHTML = viewOrders();
  else if(view==="orderDetail") app.innerHTML = viewOrderDetail(viewParam);
  else if(view==="pms") app.innerHTML = viewPms();
  else if(view==="admin") app.innerHTML = viewAdmin();
  else if(view==="login") app.innerHTML = viewLogin();
  else if(view==="register") app.innerHTML = viewRegister();
}
function logout(){ setSession(null); toast("已退出登录"); go("rooms"); }
function resetData(){
  if(!confirm("确定要重置吗？所有演示数据（订单、点评、房态等）将恢复到初始状态。")) return;
  DB = seedData(); save(); setSession(null); toast("演示数据已重置"); go("rooms");
}
function requireLogin(){
  if(me()) return true;
  toast("请先登录"); go("login"); return false;
}

/* ============ 房型浏览 / 搜索 ============ */
function viewRooms(){
  const { checkIn, checkOut, guests, kw } = search;
  const list = DB.roomTypes.filter(rt => rt.active)
    .filter(rt => rt.capacity >= Number(guests))
    .filter(rt => !kw || rt.name.includes(kw) || rt.desc.includes(kw));
  return `
  <div class="card">
    <h2>预订房间</h2>
    <div class="note">这是与仓库中 Spring Boot + Vue 正式版功能一一对应的单文件演示版：数据保存在浏览器本地（localStorage），库存按「每一晚」核算、库存不足会拦截下单（防超卖），待支付订单 ${PAY_MINUTES} 分钟未付自动取消。正式版代码在 GitHub 仓库 hotel-booking-system。</div>
    <div class="search-bar">
      <label class="field">入住日期<input type="date" id="s-in" value="${checkIn}"></label>
      <label class="field">离店日期<input type="date" id="s-out" value="${checkOut}"></label>
      <label class="field">入住人数
        <select id="s-guests">${[1,2,3,4].map(n=>`<option value="${n}" ${Number(guests)===n?"selected":""}>${n} 人</option>`).join("")}</select>
      </label>
      <label class="field">关键词<input type="text" id="s-kw" placeholder="如：海景 / 办公" value="${esc(kw)}"></label>
      <button class="btn" onclick="doSearch()">🔍 查询空房</button>
    </div>
  </div>
  <div class="grid">
    ${list.map(rt=>{
      const av = availability(rt.id, checkIn, checkOut);
      const rs = reviewSummary(rt.id);
      return `<div class="room-card">
        <div class="room-cover ${rt.grade}">${rt.icon}</div>
        <div class="room-body">
          <h3>${esc(rt.name)}</h3>
          <div class="specs">${rt.area}㎡ · ${esc(rt.bed)} · 可住 ${rt.capacity} 人</div>
          <div class="specs">${esc(rt.desc)}</div>
          <div class="chips">${rt.amenities.map(a=>`<span class="chip">${esc(a)}</span>`).join("")}</div>
          <div>${rs.count ? `<span class="stars">${"★".repeat(Math.round(rs.avg))}</span> <b>${rs.avg}</b> 分 · ${rs.count} 条点评` : `<span class="muted">暂无点评</span>`}</div>
          <div class="price-row">
            <span class="price">${money(rt.price)}<small> / 晚</small></span>
            ${av>0 ? `<span class="badge ${av<=2?"b-warn":"b-ok"}">所选日期剩 ${av} 间</span>` : `<span class="badge b-bad">所选日期已订满</span>`}
          </div>
          <div class="actions">
            <button class="btn light" onclick="go('detail','${rt.id}')">查看详情 / 点评</button>
            <button class="btn" ${av<=0?"disabled":""} onclick="startBooking('${rt.id}')">立即预订</button>
          </div>
        </div>
      </div>`;
    }).join("") || `<div class="card">没有符合条件的房型，换个日期或人数试试。</div>`}
  </div>`;
}
function doSearch(){
  const ci = $("#s-in").value, co = $("#s-out").value;
  if(!ci || !co || nightsBetween(ci,co) < 1){ toast("离店日期必须晚于入住日期"); return; }
  search = { checkIn:ci, checkOut:co, guests:$("#s-guests").value, kw:$("#s-kw").value.trim() };
  render();
}
function startBooking(rtId){
  bookingDraft = { roomTypeId: rtId, checkIn: search.checkIn, checkOut: search.checkOut, rooms: 1 };
  go("booking");
}

/* ============ 房型详情 + 点评 ============ */
function viewDetail(rtId){
  const rt = rtById(rtId);
  if(!rt) return `<div class="card">房型不存在。<a href="javascript:go('rooms')">返回</a></div>`;
  const rs = reviewSummary(rtId);
  const revs = DB.reviews.filter(r=>r.roomTypeId===rtId).slice().reverse();
  const av = availability(rtId, search.checkIn, search.checkOut);
  return `
  <div class="card">
    <button class="btn light small" onclick="go('rooms')">← 返回房型列表</button>
    <div class="room-cover ${rt.grade}" style="border-radius:18px;margin:14px 0;height:150px">${rt.icon}</div>
    <h2>${esc(rt.name)}</h2>
    <p class="specs" style="font-size:14px">${rt.area}㎡ · ${esc(rt.bed)} · 可住 ${rt.capacity} 人 · 共 ${rt.totalRooms} 间</p>
    <p style="margin:10px 0">${esc(rt.desc)}</p>
    <div class="chips">${rt.amenities.map(a=>`<span class="chip">${esc(a)}</span>`).join("")}</div>
    <div class="price-row" style="margin-top:14px">
      <span class="price">${money(rt.price)}<small> / 晚</small></span>
      ${av>0 ? `<span class="badge b-ok">${search.checkIn} ~ ${search.checkOut} 剩 ${av} 间</span>` : `<span class="badge b-bad">所选日期已订满</span>`}
      <button class="btn" ${av<=0?"disabled":""} onclick="startBooking('${rt.id}')">立即预订</button>
    </div>
  </div>
  <div class="card">
    <h2>住客点评 ${rs.count ? `· ${rs.avg} 分（${rs.count} 条）` : ""}</h2>
    ${revs.map(r=>`<div class="review">
      <b>${esc(r.userName)}</b> <span class="stars">${"★".repeat(r.rating)}${"☆".repeat(5-r.rating)}</span>
      <span class="muted">${r.date}</span><div style="margin-top:4px">${esc(r.content)}</div>
    </div>`).join("") || `<p class="muted">暂无点评。完成一次入住后，可以在订单详情里点评。</p>`}
    <h3>写点评</h3>
    <div class="form-grid">
      <label class="field">评分
        <select id="rev-rating">${[5,4,3,2,1].map(n=>`<option value="${n}">${n} 分</option>`).join("")}</select>
      </label>
      <label class="field" style="grid-column:span 2">内容<input type="text" id="rev-content" placeholder="说说这次入住体验"></label>
    </div>
    <div class="actions"><button class="btn" onclick="addReview('${rt.id}')">发布点评</button></div>
    <p class="muted" style="margin-top:8px">提示：在「我的订单」里对已完成订单点评，会和订单绑定，更真实。</p>
  </div>`;
}
function addReview(roomTypeId, reservationId){
  if(!requireLogin()) return;
  const contentEl = $("#rev-content");
  const content = reservationId ? $("#rev-content-od").value.trim() : (contentEl ? contentEl.value.trim() : "");
  const rating = Number((reservationId ? $("#rev-rating-od") : $("#rev-rating")).value);
  if(!content){ toast("先写一句点评内容吧"); return; }
  DB.reviews.push({ id:uid("rev-"), roomTypeId, userId:me().id, userName:me().name, rating, content, date:todayStr(0), reservationId: reservationId || null });
  save(); toast("点评已发布"); closeModal();
  if(reservationId) go("orderDetail", reservationId); else go("detail", roomTypeId);
}

/* ============ 预订下单（防超卖校验） ============ */
function viewBooking(){
  if(!bookingDraft.roomTypeId) bookingDraft.roomTypeId = DB.roomTypes[0].id;
  const rt = rtById(bookingDraft.roomTypeId);
  const u = me();
  const nights = Math.max(0, nightsBetween(bookingDraft.checkIn, bookingDraft.checkOut));
  const av = availability(rt.id, bookingDraft.checkIn, bookingDraft.checkOut);
  const total = nights * rt.price * Number(bookingDraft.rooms || 1);
  return `
  <div class="card">
    <h2>填写预订信息</h2>
    <div class="form-grid">
      <label class="field">房型
        <select id="b-type" onchange="updBooking('roomTypeId', this.value)">
          ${DB.roomTypes.filter(r=>r.active).map(r=>`<option value="${r.id}" ${r.id===rt.id?"selected":""}>${esc(r.name)}（${money(r.price)}/晚）</option>`).join("")}
        </select>
      </label>
      <label class="field">房间数
        <select id="b-rooms" onchange="updBooking('rooms', this.value)">
          ${[1,2,3].map(n=>`<option value="${n}" ${Number(bookingDraft.rooms)===n?"selected":""}>${n} 间</option>`).join("")}
        </select>
      </label>
      <label class="field">入住日期<input type="date" id="b-in" value="${bookingDraft.checkIn}" onchange="updBooking('checkIn', this.value)"></label>
      <label class="field">离店日期<input type="date" id="b-out" value="${bookingDraft.checkOut}" onchange="updBooking('checkOut', this.value)"></label>
      <label class="field">入住人姓名<input type="text" id="b-name" value="${esc(bookingDraft.guestName ?? (u ? u.name : ""))}" placeholder="如：张三"></label>
      <label class="field">手机号<input type="tel" id="b-phone" value="${esc(bookingDraft.guestPhone ?? (u ? u.phone : ""))}" placeholder="11 位手机号"></label>
      <label class="field" style="grid-column:span 2">备注<input type="text" id="b-remark" value="${esc(bookingDraft.remark ?? "")}" placeholder="如：高楼层 / 需要婴儿床（选填）"></label>
    </div>
    <h3>费用明细</h3>
    <table>
      <tr><th>房型</th><th>单价</th><th>晚数</th><th>房间数</th><th>小计</th></tr>
      <tr><td>${esc(rt.name)}</td><td>${money(rt.price)}</td><td>${nights} 晚</td><td>${bookingDraft.rooms} 间</td><td><b>${money(total)}</b></td></tr>
    </table>
    <p style="margin-top:10px">
      ${nights<1 ? `<span class="badge b-bad">日期不合法：离店必须晚于入住</span>`
        : av >= Number(bookingDraft.rooms) ? `<span class="badge b-ok">库存充足：所选区间每晚至少剩 ${av} 间</span>`
        : `<span class="badge b-bad">库存不足：所选区间最多可订 ${Math.max(av,0)} 间（防超卖拦截）</span>`}
    </p>
    <div class="actions">
      <button class="btn light" onclick="go('rooms')">返回</button>
      <button class="btn" ${nights<1 || av < Number(bookingDraft.rooms) ? "disabled":""} onclick="submitBooking()">提交订单（待支付）</button>
    </div>
    <p class="muted" style="margin-top:8px">提交后订单为「待支付」，请在 ${PAY_MINUTES} 分钟内完成支付，超时将自动取消并释放库存。</p>
  </div>`;
}
function updBooking(k, v){
  const n = $("#b-name"), p = $("#b-phone"), rm = $("#b-remark");
  if(n) bookingDraft.guestName = n.value; if(p) bookingDraft.guestPhone = p.value; if(rm) bookingDraft.remark = rm.value;
  bookingDraft[k] = (k==="rooms") ? Number(v) : v; render();
}
function submitBooking(){
  if(!requireLogin()) return;
  const rt = rtById(bookingDraft.roomTypeId);
  const name = $("#b-name").value.trim(), phone = $("#b-phone").value.trim();
  if(!name){ toast("请填写入住人姓名"); return; }
  if(!/^1\d{10}$/.test(phone)){ toast("请填写正确的 11 位手机号"); return; }
  const nights = nightsBetween(bookingDraft.checkIn, bookingDraft.checkOut);
  if(nights < 1){ toast("日期不合法"); return; }
  /* 下单瞬间再次按晚校验库存 —— 与后端事务内的防超卖校验同一口径 */
  const av = availability(rt.id, bookingDraft.checkIn, bookingDraft.checkOut);
  if(av < bookingDraft.rooms){ toast(`库存不足，最多可订 ${Math.max(av,0)} 间`); render(); return; }
  const total = nights * rt.price * bookingDraft.rooms;
  const res = {
    id: uid("r-"), orderNo: "HB" + todayStr(0).replaceAll("-","") + String(DB.orderSeq++).padStart(4,"0"),
    userId: me().id, guestName: name, guestPhone: phone,
    items: [{ roomTypeId: rt.id, rooms: bookingDraft.rooms, price: rt.price }],
    checkIn: bookingDraft.checkIn, checkOut: bookingDraft.checkOut,
    totalAmount: total, status: "UNPAID", createdAt: Date.now(), paidAt: null,
    assignedRoomId: null, remark: $("#b-remark").value.trim()
  };
  DB.reservations.push(res); save();
  toast("下单成功，请尽快支付");
  go("orderDetail", res.id);
}
</script>
<script>
/* ============ 我的订单 / 订单详情 / 支付 / 取消 ============ */
function resTitle(r){ return r.items.map(it => `${esc(rtById(it.roomTypeId)?.name || "房型")} × ${it.rooms}间`).join("，"); }
function remainText(r){
  const left = PAY_MINUTES*60*1000 - (Date.now() - r.createdAt);
  if(left <= 0) return "已超时";
  const m = Math.floor(left/60000), s = Math.floor(left%60000/1000);
  return `剩余支付时间 ${m} 分 ${s} 秒`;
}
function viewOrders(){
  if(!me()) return `<div class="card"><h2>我的订单</h2><p>登录后可以查看和管理你的订单。</p><div class="actions"><button class="btn" onclick="go('login')">去登录</button></div></div>`;
  expireOrders();
  const u = me();
  let list = DB.reservations.filter(r=>r.userId===u.id).slice().reverse();
  if(orderFilter!=="ALL") list = list.filter(r=>r.status===orderFilter);
  const tabs = [["ALL","全部"], ...Object.entries(STATUS).map(([k,v])=>[k,v.t])];
  return `
  <div class="card">
    <h2>我的订单</h2>
    <div class="tabs">${tabs.map(([k,t])=>`<button class="tab ${orderFilter===k?'active':''}" onclick="orderFilter='${k}';render()">${t}</button>`).join("")}</div>
    ${list.map(r=>`
    <div class="order-card">
      <div class="order-head">
        <span class="order-no">${r.orderNo}</span>
        <span class="badge ${STATUS[r.status].cls}">${STATUS[r.status].t}</span>
      </div>
      <div>${resTitle(r)}</div>
      <div class="muted">${r.checkIn} 入住 → ${r.checkOut} 离店 · ${nightsBetween(r.checkIn, r.checkOut)} 晚 · 入住人 ${esc(r.guestName)}</div>
      <div style="margin-top:6px">总价 <b style="color:#E2703A">${money(r.totalAmount)}</b>
        ${r.status==="UNPAID" ? `<span class="badge b-warn">${remainText(r)}</span>` : ""}
        ${r.assignedRoomId ? `<span class="badge b-ok">房间 ${roomById(r.assignedRoomId)?.number || ""}</span>` : ""}
      </div>
      <div class="actions">
        <button class="btn light small" onclick="go('orderDetail','${r.id}')">订单详情</button>
        ${r.status==="UNPAID" ? `<button class="btn small" onclick="openPay('${r.id}')">立即支付</button>` : ""}
        ${["UNPAID","PAID"].includes(r.status) ? `<button class="btn danger small" onclick="cancelOrder('${r.id}')">取消订单</button>` : ""}
        ${r.status==="PAID" ? `<span class="muted">入住当天请带身份证到前台办理入住</span>` : ""}
      </div>
    </div>`).join("") || `<p class="muted">这个状态下暂时没有订单。</p>`}
  </div>`;
}
function statusTimeline(r){
  const flow = ["UNPAID","PAID","CHECKED_IN","COMPLETED"];
  const idx = flow.indexOf(r.status);
  if(r.status==="CANCELLED" || r.status==="EXPIRED") return `<div class="timeline"><span class="tl-dot on">已下单</span><span class="tl-arrow">→</span><span class="tl-dot on">${STATUS[r.status].t}</span></div>`;
  return `<div class="timeline">${flow.map((s,i)=>`${i?'<span class="tl-arrow">→</span>':''}<span class="tl-dot ${i<=idx?'on':''}">${STATUS[s].t}</span>`).join("")}</div>`;
}
function viewOrderDetail(id){
  const r = resById(id);
  if(!r) return `<div class="card">订单不存在。</div>`;
  const u = me();
  if(!u || (u.id!==r.userId && u.role==="USER")) return `<div class="card">无权查看此订单。</div>`;
  const pays = DB.payments.filter(p=>p.reservationId===r.id);
  return `
  <div class="card">
    <button class="btn light small" onclick="go('orders')">← 返回我的订单</button>
    <h2 style="margin-top:12px">订单 ${r.orderNo} <span class="badge ${STATUS[r.status].cls}">${STATUS[r.status].t}</span></h2>
    ${statusTimeline(r)}
    ${r.status==="UNPAID" ? `<p><span class="badge b-warn">${remainText(r)}，超时自动取消</span></p>` : ""}
    <dl class="kv" style="margin-top:10px">
      <dt>房型</dt><dd>${resTitle(r)}</dd>
      <dt>入住 / 离店</dt><dd>${r.checkIn} → ${r.checkOut}（${nightsBetween(r.checkIn, r.checkOut)} 晚）</dd>
      <dt>入住人</dt><dd>${esc(r.guestName)} · ${esc(r.guestPhone)}</dd>
      <dt>下单用户</dt><dd>${esc(userById(r.userId)?.name || "-")}</dd>
      <dt>房间号</dt><dd>${r.assignedRoomId ? roomById(r.assignedRoomId)?.number + " 房" : "入住时由前台分配"}</dd>
      <dt>备注</dt><dd>${esc(r.remark) || "无"}</dd>
      <dt>订单总价</dt><dd style="color:#E2703A">${money(r.totalAmount)}</dd>
    </dl>
    <h3>支付记录</h3>
    ${pays.length ? `<table><tr><th>方式</th><th>金额</th><th>状态</th><th>流水号</th><th>时间</th></tr>
      ${pays.map(p=>`<tr><td>${p.method}</td><td>${money(p.amount)}</td><td>${p.status==="SUCCESS"?"支付成功":"已退款"}</td><td>${p.tradeNo}</td><td>${new Date(p.paidAt).toLocaleString("zh-CN")}</td></tr>`).join("")}</table>`
      : `<p class="muted">暂无支付记录。</p>`}
    <div class="actions">
      ${r.status==="UNPAID" ? `<button class="btn" onclick="openPay('${r.id}')">立即支付</button>` : ""}
      ${["UNPAID","PAID"].includes(r.status) ? `<button class="btn danger" onclick="cancelOrder('${r.id}')">取消订单</button>` : ""}
      ${(u.role==="STAFF"||u.role==="ADMIN") && r.status==="PAID" ? `<button class="btn" onclick="go('pms')">去前台办理入住 →</button>` : ""}
    </div>
    ${canReview(r) ? `
    <h3>评价这次入住</h3>
    <div class="form-grid">
      <label class="field">评分<select id="rev-rating-od">${[5,4,3,2,1].map(n=>`<option value="${n}">${n} 分</option>`).join("")}</select></label>
      <label class="field" style="grid-column:span 2">内容<input type="text" id="rev-content-od" placeholder="说说这次入住体验"></label>
    </div>
    <div class="actions"><button class="btn" onclick="addReview('${r.items[0].roomTypeId}','${r.id}')">发布点评</button></div>` : ""}
    ${r.status==="COMPLETED" && DB.reviews.some(x=>x.reservationId===r.id) ? `<p class="muted" style="margin-top:10px">✅ 已点评，感谢反馈。</p>` : ""}
  </div>`;
}
function openPay(id){
  const r = resById(id);
  openModal(`
    <h3>模拟支付 · ${money(r.totalAmount)}</h3>
    <p class="muted" style="margin-bottom:12px">演示版不会真实扣款，选择一种方式即可完成支付（对应后端 Payment 模块）。</p>
    <div class="form-grid">
      <label class="field">支付方式
        <select id="pay-method"><option>微信支付</option><option>支付宝</option><option>银行卡</option></select>
      </label>
    </div>
    <div class="actions">
      <button class="btn" onclick="doPay('${id}')">确认支付 ${money(r.totalAmount)}</button>
      <button class="btn light" onclick="closeModal()">再想想</button>
    </div>`);
}
function doPay(id){
  const r = resById(id);
  if(r.status!=="UNPAID"){ toast("订单状态已变化，无法支付"); closeModal(); render(); return; }
  const method = $("#pay-method").value;
  DB.payments.push({ id:uid("p-"), reservationId:id, amount:r.totalAmount, method, status:"SUCCESS", tradeNo:uid("TRX").toUpperCase(), paidAt:Date.now() });
  r.status = "PAID"; r.paidAt = Date.now(); save(); closeModal();
  toast("支付成功，订单已确认");
  go("orderDetail", id);
}
function cancelOrder(id){
  const r = resById(id);
  if(!confirm(`确定取消订单 ${r.orderNo} 吗？${r.status==="PAID" ? "已支付金额将原路退回（模拟）。" : ""}取消后库存会立即释放。`)) return;
  if(r.assignedRoomId){ const rm = roomById(r.assignedRoomId); if(rm) rm.status = "DIRTY"; r.assignedRoomId = null; }
  if(r.status==="PAID"){
    DB.payments.filter(p=>p.reservationId===id && p.status==="SUCCESS").forEach(p=> p.status="REFUNDED");
  }
  r.status = "CANCELLED"; save(); toast("订单已取消"); render();
}

/* ============ 前台 PMS：房态 / 入住 / 退房 ============ */
function viewPms(){
  const u = me();
  if(!u || !(u.role==="STAFF" || u.role==="ADMIN")) return `<div class="card"><h2>前台 PMS</h2><p>该功能仅前台和管理员可用，请用 staff / admin 账号登录。</p><div class="actions"><button class="btn" onclick="go('login')">去登录</button></div></div>`;
  expireOrders();
  const t = todayStr(0);
  const arrivals = DB.reservations.filter(r=>r.status==="PAID" && r.checkIn===t);
  const inHouse = DB.reservations.filter(r=>r.status==="CHECKED_IN");
  const cnt = s => DB.rooms.filter(r=>r.status===s).length;
  return `
  <div class="card">
    <h2>前台工作台 · ${t}</h2>
    <div class="stats">
      <div class="stat"><div class="num">${arrivals.length}</div><div class="lbl">今日待入住</div></div>
      <div class="stat"><div class="num">${inHouse.length}</div><div class="lbl">当前在住</div></div>
      <div class="stat"><div class="num">${cnt("VACANT")}</div><div class="lbl">空净房</div></div>
      <div class="stat"><div class="num">${cnt("DIRTY")}</div><div class="lbl">空脏待清洁</div></div>
      <div class="stat"><div class="num">${cnt("MAINTENANCE")}</div><div class="lbl">维修中</div></div>
    </div>
  </div>
  <div class="card">
    <h2>今日到店（办理入住）</h2>
    ${arrivals.map(r=>`<div class="order-card">
      <div class="order-head"><span class="order-no">${r.orderNo}</span><span class="badge b-info">${STATUS[r.status].t}</span></div>
      <div>${resTitle(r)} · ${esc(r.guestName)}（${esc(r.guestPhone)}）· 住 ${nightsBetween(r.checkIn, r.checkOut)} 晚 ${r.remark ? "· 备注：" + esc(r.remark) : ""}</div>
      <div class="actions"><button class="btn small" onclick="openCheckIn('${r.id}')">分配房间并入住</button>
      <button class="btn light small" onclick="go('orderDetail','${r.id}')">订单详情</button></div>
    </div>`).join("") || `<p class="muted">今天暂时没有待入住的订单。</p>`}
    <h3>当前在住（办理退房）</h3>
    ${inHouse.map(r=>`<div class="order-card">
      <div class="order-head"><span class="order-no">${r.orderNo}</span><span class="badge b-ok">已入住 · ${roomById(r.assignedRoomId)?.number || "?"} 房</span></div>
      <div>${resTitle(r)} · ${esc(r.guestName)} · ${r.checkIn} → ${r.checkOut}</div>
      <div class="actions"><button class="btn small" onclick="checkOut('${r.id}')">办理退房</button></div>
    </div>`).join("") || `<p class="muted">当前没有在住订单。</p>`}
  </div>
  <div class="card">
    <h2>房态看板（点任意房间可改状态）</h2>
    <div class="board">
      ${DB.rooms.slice().sort((a,b)=>a.number-b.number).map(rm=>`<div class="cell st-${rm.status}" onclick="openRoomStatus('${rm.id}')">
        <div class="no">${rm.number}</div><div class="st">${ROOM_STATUS[rm.status]}</div><div class="tp">${esc(rtById(rm.roomTypeId)?.name || "")}</div>
      </div>`).join("")}
    </div>
    <p class="muted" style="margin-top:10px">空净 = 可售可入住；在住 = 已分配给在住订单；空脏 = 退房后待清洁，清洁完成改回空净；维修中 = 暂停售卖。</p>
  </div>`;
}
function openCheckIn(resId){
  const r = resById(resId);
  const typeId = r.items[0].roomTypeId;
  const free = DB.rooms.filter(rm=>rm.roomTypeId===typeId && rm.status==="VACANT");
  if(!free.length){ toast("该房型没有空净房了，请先在房态看板里把空脏房改为清洁完成"); return; }
  openModal(`
    <h3>办理入住 · ${r.orderNo}</h3>
    <p style="margin-bottom:10px">${esc(rtById(typeId).name)} · 入住人 ${esc(r.guestName)}${r.remark ? " · 备注：" + esc(r.remark) : ""}</p>
    <label class="field">选择空净房
      <select id="ci-room">${free.map(rm=>`<option value="${rm.id}">${rm.number} 房</option>`).join("")}</select>
    </label>
    <div class="actions"><button class="btn" onclick="doCheckIn('${resId}')">确认入住</button>
    <button class="btn light" onclick="closeModal()">取消</button></div>`);
}
function doCheckIn(resId){
  const r = resById(resId);
  const room = roomById($("#ci-room").value);
  if(!room || room.status!=="VACANT"){ toast("该房间状态已变化，请重新选择"); return; }
  r.assignedRoomId = room.id; r.status = "CHECKED_IN"; room.status = "OCCUPIED";
  save(); closeModal(); toast(`已入住：${room.number} 房`); go("pms");
}
function checkOut(resId){
  const r = resById(resId);
  if(!confirm(`给订单 ${r.orderNo} 办理退房？退房后房间变为「空脏待清洁」。`)) return;
  const room = roomById(r.assignedRoomId);
  if(room) room.status = "DIRTY";
  r.status = "COMPLETED"; save(); toast("退房完成，客人可在订单里点评了"); go("pms");
}
function openRoomStatus(roomId){
  const rm = roomById(roomId);
  if(rm.status==="OCCUPIED"){ toast("在住房间不能直接改状态，请先为对应订单办理退房"); return; }
  openModal(`
    <h3>${rm.number} 房 · ${esc(rtById(rm.roomTypeId)?.name || "")}</h3>
    <p style="margin-bottom:10px">当前状态：<b>${ROOM_STATUS[rm.status]}</b></p>
    <label class="field">改为
      <select id="rs-status">
        ${Object.entries(ROOM_STATUS).filter(([k])=>k!=="OCCUPIED").map(([k,v])=>`<option value="${k}" ${rm.status===k?"selected":""}>${v}</option>`).join("")}
      </select>
    </label>
    <div class="actions"><button class="btn" onclick="doRoomStatus('${roomId}')">保存</button>
    <button class="btn light" onclick="closeModal()">取消</button></div>`);
}
function doRoomStatus(roomId){
  const rm = roomById(roomId);
  rm.status = $("#rs-status").value; save(); closeModal(); toast("房态已更新"); go("pms");
}
</script>
<script>
/* ============ 管理后台 ============ */
function syncRooms(rt){
  const mine = DB.rooms.filter(r=>r.roomTypeId===rt.id);
  if(mine.length < rt.totalRooms){
    let maxNo = mine.length ? Math.max(...mine.map(r=>r.number)) : 100;
    for(let i=mine.length;i<rt.totalRooms;i++){
      maxNo += 1;
      DB.rooms.push({ id:uid("room-"), roomTypeId:rt.id, number:maxNo, status:"VACANT" });
    }
  } else if(mine.length > rt.totalRooms){
    let need = mine.length - rt.totalRooms;
    for(let i=mine.length-1;i>=0 && need>0;i--){
      if(mine[i].status==="VACANT"){ DB.rooms = DB.rooms.filter(r=>r.id!==mine[i].id); need--; }
    }
    if(need>0){ rt.totalRooms = DB.rooms.filter(r=>r.roomTypeId===rt.id).length; toast("有房间在住/维修，间数只能先减到 " + rt.totalRooms); }
  }
}
function viewAdmin(){
  const u = me();
  if(!u || u.role!=="ADMIN") return `<div class="card"><h2>管理后台</h2><p>该功能仅管理员可用，请用 admin 账号登录。</p><div class="actions"><button class="btn" onclick="go('login')">去登录</button></div></div>`;
  expireOrders();
  const revenue = DB.payments.filter(p=>p.status==="SUCCESS").reduce((s,p)=>s+p.amount,0);
  const refunded = DB.payments.filter(p=>p.status==="REFUNDED").reduce((s,p)=>s+p.amount,0);
  const totalRoomsAll = DB.roomTypes.reduce((s,r)=>s+r.totalRooms,0);
  const occupiedTonight = DB.roomTypes.reduce((s,rt)=> s + bookedOn(rt.id, todayStr(0), null), 0);
  const occRate = totalRoomsAll ? Math.round(occupiedTonight/totalRoomsAll*100) : 0;
  return `
  <div class="card">
    <h2>经营概览</h2>
    <div class="stats">
      <div class="stat"><div class="num">${DB.reservations.length}</div><div class="lbl">订单总数</div></div>
      <div class="stat"><div class="num">${money(revenue)}</div><div class="lbl">已收款（未扣退款）</div></div>
      <div class="stat"><div class="num">${money(refunded)}</div><div class="lbl">已退款</div></div>
      <div class="stat"><div class="num">${occRate}%</div><div class="lbl">今晚入住率（${occupiedTonight}/${totalRoomsAll} 间）</div></div>
      <div class="stat"><div class="num">${DB.users.length}</div><div class="lbl">注册用户</div></div>
    </div>
  </div>
  <div class="card">
    <h2>房型管理</h2>
    <table>
      <tr><th>房型</th><th>价格/晚</th><th>间数</th><th>可住</th><th>状态</th><th>操作</th></tr>
      ${DB.roomTypes.map(rt=>`<tr>
        <td>${rt.icon} ${esc(rt.name)}</td><td>${money(rt.price)}</td><td>${rt.totalRooms}</td><td>${rt.capacity} 人</td>
        <td>${rt.active ? '<span class="badge b-ok">在售</span>' : '<span class="badge b-grey">已下架</span>'}</td>
        <td><button class="btn light small" onclick="openEditType('${rt.id}')">编辑</button>
            <button class="btn light small" onclick="toggleType('${rt.id}')">${rt.active ? "下架" : "上架"}</button></td>
      </tr>`).join("")}
    </table>
    <div class="actions"><button class="btn" onclick="openAddType()">＋ 新增房型</button></div>
  </div>
  <div class="card">
    <h2>全部订单</h2>
    <table>
      <tr><th>订单号</th><th>客人</th><th>房型</th><th>入住 → 离店</th><th>金额</th><th>状态</th><th></th></tr>
      ${DB.reservations.slice().reverse().map(r=>`<tr>
        <td>${r.orderNo}</td><td>${esc(r.guestName)}</td><td>${resTitle(r)}</td>
        <td>${r.checkIn} → ${r.checkOut}</td><td>${money(r.totalAmount)}</td>
        <td><span class="badge ${STATUS[r.status].cls}">${STATUS[r.status].t}</span></td>
        <td><button class="btn light small" onclick="go('orderDetail','${r.id}')">详情</button></td>
      </tr>`).join("")}
    </table>
  </div>
  <div class="card">
    <h2>用户管理</h2>
    <table>
      <tr><th>账号</th><th>姓名</th><th>手机号</th><th>角色</th></tr>
      ${DB.users.map(x=>`<tr><td>${esc(x.username)}</td><td>${esc(x.name)}</td><td>${esc(x.phone)}</td>
        <td><span class="badge ${x.role==="USER"?"b-grey":"b-info"}">${{USER:"普通用户",STAFF:"前台",ADMIN:"管理员"}[x.role]}</span></td></tr>`).join("")}
    </table>
    <p class="muted" style="margin-top:8px">演示版不在后台明文展示密码；正式版密码经哈希存储，接口由 JWT + 角色注解鉴权。</p>
  </div>`;
}
function toggleType(id){ const rt = rtById(id); rt.active = !rt.active; save(); toast(rt.active ? "已上架" : "已下架"); go("admin"); }
function typeForm(rt){
  return `
  <div class="form-grid">
    <label class="field">房型名称<input type="text" id="tf-name" value="${rt ? esc(rt.name) : ""}" placeholder="如：豪华大床房"></label>
    <label class="field">价格（元/晚）<input type="number" id="tf-price" min="1" value="${rt ? rt.price : 399}"></label>
    <label class="field">房间总数<input type="number" id="tf-total" min="1" value="${rt ? rt.totalRooms : 3}"></label>
    <label class="field">可住人数<input type="number" id="tf-cap" min="1" value="${rt ? rt.capacity : 2}"></label>
    <label class="field">面积（㎡）<input type="number" id="tf-area" min="1" value="${rt ? rt.area : 35}"></label>
    <label class="field">床型<input type="text" id="tf-bed" value="${rt ? esc(rt.bed) : "1.8m 大床"}"></label>
    <label class="field" style="grid-column:span 2">简介<input type="text" id="tf-desc" value="${rt ? esc(rt.desc) : ""}" placeholder="一句话卖点"></label>
  </div>`;
}
function openEditType(id){ const rt = rtById(id); openModal(`<h3>编辑房型 · ${esc(rt.name)}</h3>${typeForm(rt)}
  <div class="actions"><button class="btn" onclick="saveType('${id}')">保存</button><button class="btn light" onclick="closeModal()">取消</button></div>`); }
function openAddType(){ openModal(`<h3>新增房型</h3>${typeForm(null)}
  <div class="actions"><button class="btn" onclick="saveType(null)">创建</button><button class="btn light" onclick="closeModal()">取消</button></div>`); }
function saveType(id){
  const name = $("#tf-name").value.trim();
  const price = Number($("#tf-price").value), total = Number($("#tf-total").value), cap = Number($("#tf-cap").value);
  if(!name || !(price>0) || !(total>0) || !(cap>0)){ toast("名称、价格、间数、人数都要填对"); return; }
  const data = { name, price, totalRooms: total, capacity: cap, area: Number($("#tf-area").value)||30, bed: $("#tf-bed").value.trim()||"大床", desc: $("#tf-desc").value.trim() };
  if(id){ Object.assign(rtById(id), data); syncRooms(rtById(id)); }
  else {
    const rt = { id:uid("rt-"), ...data, grade:"g1", icon:"🛏️", amenities:["免费WiFi","空调","电视"], active:true };
    DB.roomTypes.push(rt); syncRooms(rt);
  }
  save(); closeModal(); toast("房型已保存"); go("admin");
}

/* ============ 登录 / 注册 ============ */
function viewLogin(){
  return `
  <div class="card auth-wrap">
    <h2>登录</h2>
    <div class="form-grid" style="grid-template-columns:1fr">
      <label class="field">账号<input type="text" id="li-user" placeholder="演示账号见下方一键登录"></label>
      <label class="field">密码<input type="password" id="li-pwd" placeholder="密码"></label>
    </div>
    <div class="actions"><button class="btn" onclick="doLogin()">登录</button>
    <button class="btn light" onclick="go('register')">没有账号？去注册</button></div>
    <h3>一键登录（演示账号）</h3>
    <div class="quick">
      <button class="btn light small" onclick="quickLogin('guest')">👤 普通用户 guest / user123</button>
      <button class="btn light small" onclick="quickLogin('staff')">🛎️ 前台 staff / staff123</button>
      <button class="btn light small" onclick="quickLogin('admin')">⚙️ 管理员 admin / admin123</button>
    </div>
  </div>`;
}
function afterLogin(u){
  toast(`欢迎回来，${u.name}`);
  if(u.role==="ADMIN") go("admin"); else if(u.role==="STAFF") go("pms"); else go("orders");
}
function doLogin(){
  const un = $("#li-user").value.trim(), pw = $("#li-pwd").value;
  const u = DB.users.find(x=>x.username===un && x.password===pw);
  if(!u){ toast("账号或密码不正确"); return; }
  setSession(u.id); afterLogin(u);
}
function quickLogin(un){
  const u = DB.users.find(x=>x.username===un);
  setSession(u.id); afterLogin(u);
}
function viewRegister(){
  return `
  <div class="card auth-wrap">
    <h2>注册新账号</h2>
    <div class="form-grid" style="grid-template-columns:1fr">
      <label class="field">账号<input type="text" id="rg-user" placeholder="字母/数字，登录用"></label>
      <label class="field">密码<input type="password" id="rg-pwd" placeholder="至少 6 位"></label>
      <label class="field">姓名<input type="text" id="rg-name" placeholder="真实姓名"></label>
      <label class="field">手机号<input type="tel" id="rg-phone" placeholder="11 位手机号"></label>
    </div>
    <div class="actions"><button class="btn" onclick="doRegister()">注册并登录</button>
    <button class="btn light" onclick="go('login')">已有账号？去登录</button></div>
  </div>`;
}
function doRegister(){
  const un = $("#rg-user").value.trim(), pw = $("#rg-pwd").value, name = $("#rg-name").value.trim(), phone = $("#rg-phone").value.trim();
  if(!un || pw.length < 6){ toast("账号不能为空，密码至少 6 位"); return; }
  if(DB.users.some(x=>x.username===un)){ toast("这个账号已被注册，换一个"); return; }
  if(!name || !/^1\d{10}$/.test(phone)){ toast("请填写姓名和正确的 11 位手机号"); return; }
  const u = { id:uid("u-"), username:un, password:pw, name, phone, role:"USER" };
  DB.users.push(u); save(); setSession(u.id); afterLogin(u);
}

/* ============ 启动 ============ */
expireOrders();
render();
setInterval(()=>{ expireOrders(); if(["orders","orderDetail"].includes(view)) render(); }, 30000);
</script>
</body>
</html>
