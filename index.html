const DB_KEY = "hotel-platform-demo-v2", SES_KEY = "hotel-platform-demo-session";

function setSession(id){ sessionUserId = id; if(id) localStorage.setItem(SES_KEY,id); else localStorage.removeItem(SES_KEY); }

const STATUS = {
  UNPAID:{ t:"待支付", cls:"b-warn" }, PAID:{ t:"已支付 · 待入住", cls:"b-info" },
  CHECKED_IN:{ t:"已入住", cls:"b-ok" }, COMPLETED:{ t:"已完成", cls:"b-grey" },
  CANCELLED:{ t:"已取消", cls:"b-bad" }, EXPIRED:{ t:"超时取消", cls:"b-bad" }
};
const ROOM_STATUS = { VACANT:"空净", OCCUPIED:"在住", DIRTY:"空脏待清洁", MAINTENANCE:"维修中" };
const hotelById = id => DB.hotels.find(h=>h.id===id);
const rtById = id => DB.roomTypes.find(r=>r.id===id);
const roomById = id => DB.rooms.find(r=>r.id===id);
const resById = id => DB.reservations.find(r=>r.id===id);
const userById = id => DB.users.find(u=>u.id===id);
const hotelOfRt = rt => hotelById(rt.hotelId);

function expireOrders(){
  const now = Date.now(); let changed = false;
  DB.reservations.forEach(r=>{
    if(r.status==="UNPAID" && now - r.createdAt > PAY_MINUTES*60*1000){ r.status="EXPIRED"; changed=true; }
  });
  if(changed) save();
}
function bookedOn(roomTypeId, night, excludeId){
  return DB.reservations.filter(r => r.id!==excludeId && ["UNPAID","PAID","CHECKED_IN"].includes(r.status)
    && r.checkIn <= night && night < r.checkOut)
    .reduce((sum,r)=> sum + r.items.filter(it=>it.roomTypeId===roomTypeId).reduce((s,it)=>s+it.rooms,0), 0);
}
function availability(roomTypeId, checkIn, checkOut, excludeId){
  const rt = rtById(roomTypeId); if(!rt) return 0;
  const ns = nightList(checkIn, checkOut); if(!ns.length) return 0;
  return Math.min(...ns.map(n => rt.totalRooms - bookedOn(roomTypeId, n, excludeId)));
}
function hotelRooms(hotelId){ return DB.roomTypes.filter(r=>r.hotelId===hotelId && r.active); }
function hotelFromPrice(hotelId){
  const rs = hotelRooms(hotelId); if(!rs.length) return { price:0, orig:0 };
  const m = rs.reduce((a,b)=> a.price<=b.price ? a : b);
  return { price:m.price, orig:m.origPrice };
}
function reviewSummary(hotelId){
  const rs = DB.reviews.filter(r=>r.hotelId===hotelId);
  if(!rs.length) return { avg:0, count:0 };
  return { avg:(rs.reduce((s,r)=>s+r.rating,0)/rs.length).toFixed(1), count:rs.length };
}
function canReview(res){
  return res.status==="COMPLETED" && !DB.reviews.some(r=>r.reservationId===res.id);
}

      <label class="field">评分<select id="rev-rating">${[5,4,3,2,1].map(n=>`<option value="${n}">${n} 分</option>`).join("")}</select></label>
      <label class="field" style="grid-column:span 2">内容<input type="text" id="rev-content" placeholder="说说这次入住体验"></label>
    </div>
    <div class="actions"><button class="btn" onclick="addReview('${h.id}', null)">发布点评</button></div>
  </div>`;
}
function addReview(hotelId, reservationId){
  if(!requireLogin()) return;
  const fromOrder = !!reservationId;
  const content = (fromOrder ? $("#rev-content-od") : $("#rev-content")).value.trim();
  const rating = Number((fromOrder ? $("#rev-rating-od") : $("#rev-rating")).value);
  if(!content){ toast("先写一句点评内容吧"); return; }
  const rtId = fromOrder ? resById(reservationId).items[0].roomTypeId : hotelRooms(hotelId)[0]?.id;
  DB.reviews.push({ id:uid("rev-"), hotelId, roomTypeId: rtId, userId:me().id, userName:me().name, rating, content, date:todayStr(0), reservationId: reservationId || null });
  save(); toast("点评已发布"); closeModal();
  if(fromOrder) go("orderDetail", reservationId); else go("detail", hotelId);
}
function startBooking(rtId){
  bookingDraft = { roomTypeId: rtId, checkIn: search.checkIn, checkOut: search.checkOut, rooms: 1 };
  go("booking");
}

/* ============ 预订下单 ============ */
function viewBooking(){
  if(!bookingDraft.roomTypeId) bookingDraft.roomTypeId = DB.roomTypes[0].id;
  const rt = rtById(bookingDraft.roomTypeId);
  const h = hotelOfRt(rt);
  const u = me();
  const nights = Math.max(0, nightsBetween(bookingDraft.checkIn, bookingDraft.checkOut));
  const av = availability(rt.id, bookingDraft.checkIn, bookingDraft.checkOut);
  const gross = nights * rt.price * Number(bookingDraft.rooms || 1);
  const discount = pointsOn ? Math.min(POINTS_YUAN, gross) : 0;
  const total = gross - discount;
  const allRooms = DB.hotels.map(hh => `<optgroup label="${esc(hh.name)}">${hotelRooms(hh.id).map(r=>`<option value="${r.id}" ${r.id===rt.id?"selected":""}>${esc(r.name)}（${money(r.price)}/晚）</option>`).join("")}</optgroup>`).join("");
  return `
  <div class="card">
    <h2>填写预订信息</h2>
    <p style="margin-bottom:12px"><b>${esc(h.name)}</b> · ${esc(rt.name)}</p>
    <div class="form-grid">
      <label class="field">酒店 / 房型<select id="b-type" onchange="updBooking('roomTypeId', this.value)">${allRooms}</select></label>
      <label class="field">房间数
        <select id="b-rooms" onchange="updBooking('rooms', this.value)">
          ${[1,2,3].map(n=>`<option value="${n}" ${Number(bookingDraft.rooms)===n?"selected":""}>${n} 间</option>`).join("")}
        </select>
      </label>
      <label class="field">入住日期<input type="date" id="b-in" value="${bookingDraft.checkIn}" onchange="updBooking('checkIn', this.value)"></label>
      <label class="field">离店日期<input type="date" id="b-out" value="${bookingDraft.checkOut}" onchange="updBooking('checkOut', this.value)"></label>
      <label class="field">入住人姓名<input type="text" id="b-name" value="${esc(bookingDraft.guestName ?? (u ? u.name : ""))}" placeholder="如：张三"></label>
      <label class="field">手机号<input type="tel" id="b-phone" value="${esc(bookingDraft.guestPhone ?? (u ? u.phone : ""))}" placeholder="11 位手机号"></label>
      <label class="field" style="grid-column:span 2">备注<input type="text" id="b-remark" value="${esc(bookingDraft.remark ?? "")}" placeholder="如：高楼层 / 晚到店（选填）"></label>
    </div>
    <h3>费用明细</h3>
    <table>
      <tr><th>房型</th><th>单价</th><th>晚数</th><th>房间数</th><th>小计</th></tr>
      <tr><td>${esc(rt.name)}</td><td>${money(rt.price)}（划线 ${money(rt.origPrice)}）</td><td>${nights} 晚</td><td>${bookingDraft.rooms} 间</td><td>${money(gross)}</td></tr>
      ${discount ? `<tr><td colspan="4">积分抵扣（${POINTS} 积分）</td><td style="color:#FA3E3E">-${money(discount)}</td></tr>` : ""}
      <tr><td colspan="4"><b>应付</b></td><td><b style="color:#FA3E3E">${money(total)}</b></td></tr>
    </table>
    <p style="margin-top:10px">
      ${nights<1 ? `<span class="badge b-bad">日期不合法：离店必须晚于入住</span>`
        : av >= Number(bookingDraft.rooms) ? `<span class="badge b-ok">库存充足：所选区间每晚至少剩 ${av} 间</span>`
        : `<span class="badge b-bad">库存不足：所选区间最多可订 ${Math.max(av,0)} 间（防超卖拦截）</span>`}
    </p>
    <div class="actions">
      <button class="btn light" onclick="go('detail','${h.id}')">返回酒店</button>
      <button class="btn red" ${nights<1 || av < Number(bookingDraft.rooms) ? "disabled":""} onclick="submitBooking(${discount})">提交订单（待支付）</button>
    </div>
    <p class="muted" style="margin-top:8px">提交后订单为「待支付」，请在 ${PAY_MINUTES} 分钟内完成支付，超时将自动取消并释放库存。</p>
  </div>`;
}
function updBooking(k, v){
  const n = $("#b-name"), p = $("#b-phone"), rm = $("#b-remark");
  if(n) bookingDraft.guestName = n.value; if(p) bookingDraft.guestPhone = p.value; if(rm) bookingDraft.remark = rm.value;
  bookingDraft[k] = (k==="rooms") ? Number(v) : v; render();
}
function submitBooking(discount){
  if(!requireLogin()) return;
  const rt = rtById(bookingDraft.roomTypeId);
  const name = $("#b-name").value.trim(), phone = $("#b-phone").value.trim();
  if(!name){ toast("请填写入住人姓名"); return; }
  if(!/^1\d{10}$/.test(phone)){ toast("请填写正确的 11 位手机号"); return; }
  const nights = nightsBetween(bookingDraft.checkIn, bookingDraft.checkOut);
  if(nights < 1){ toast("日期不合法"); return; }
  const av = availability(rt.id, bookingDraft.checkIn, bookingDraft.checkOut);
  if(av < bookingDraft.rooms){ toast(`库存不足，最多可订 ${Math.max(av,0)} 间`); render(); return; }
  const total = nights * rt.price * bookingDraft.rooms - (discount || 0);
  const res = {
    id: uid("r-"), orderNo: "HB" + todayStr(0).replaceAll("-","") + String(DB.orderSeq++).padStart(4,"0"),
    userId: me().id, guestName: name, guestPhone: phone,
    items: [{ roomTypeId: rt.id, rooms: bookingDraft.rooms, price: rt.price }],
    checkIn: bookingDraft.checkIn, checkOut: bookingDraft.checkOut,
    totalAmount: total, pointsDiscount: discount || 0, status: "UNPAID", createdAt: Date.now(), paidAt: null,
    assignedRoomId: null, remark: $("#b-remark").value.trim()
  };
  DB.reservations.push(res); save();
  toast("下单成功，请尽快支付");
  go("orderDetail", res.id);
}
</script>
<script>
/* ============ 我的订单 / 详情 / 支付 / 取消 ============ */
function resTitle(r){
  return r.items.map(it => {
    const rt = rtById(it.roomTypeId); if(!rt) return "房型 × " + it.rooms + "间";
    return `${esc(hotelOfRt(rt).name)} · ${esc(rt.name)} × ${it.rooms}间`;
  }).join("，");
}
function remainText(r){
  const left = PAY_MINUTES*60*1000 - (Date.now() - r.createdAt);
  if(left <= 0) return "已超时";
  const m = Math.floor(left/60000), s = Math.floor(left%60000/1000);
  return `剩余支付时间 ${m} 分 ${s} 秒`;
}
function viewOrders(){
  if(!me()) return `<div class="card"><h2>我的订单</h2><p>登录后可以查看和管理你的订单。</p><div class="actions"><button class="btn" onclick="go('login')">去登录</button></div></div>`;
  expireOrders();
  const u = me();
  let list = DB.reservations.filter(r=>r.userId===u.id).slice().reverse();
  if(orderFilter!=="ALL") list = list.filter(r=>r.status===orderFilter);
  const tabs = [["ALL","全部"], ...Object.entries(STATUS).map(([k,v])=>[k,v.t])];
  return `
  <div class="card">
    <h2>我的订单</h2>
    <div class="tabs">${tabs.map(([k,t])=>`<button class="tab ${orderFilter===k?'active':''}" onclick="orderFilter='${k}';render()">${t}</button>`).join("")}</div>
    ${list.map(r=>`
    <div class="order-card">
      <div class="order-head"><span class="order-no">${r.orderNo}</span><span class="badge ${STATUS[r.status].cls}">${STATUS[r.status].t}</span></div>
      <div>${resTitle(r)}</div>
      <div class="muted">${r.checkIn} 入住 → ${r.checkOut} 离店 · ${nightsBetween(r.checkIn, r.checkOut)} 晚 · 入住人 ${esc(r.guestName)}</div>
      <div style="margin-top:6px">总价 <b style="color:#FA3E3E">${money(r.totalAmount)}</b>
        ${r.status==="UNPAID" ? `<span class="badge b-warn">${remainText(r)}</span>` : ""}
        ${r.assignedRoomId ? `<span class="badge b-ok">房号 ${roomById(r.assignedRoomId)?.number || ""}</span>` : ""}
      </div>
      <div class="actions">
        <button class="btn light small" onclick="go('orderDetail','${r.id}')">订单详情</button>
        ${r.status==="UNPAID" ? `<button class="btn red small" onclick="openPay('${r.id}')">立即支付</button>` : ""}
        ${["UNPAID","PAID"].includes(r.status) ? `<button class="btn danger small" onclick="cancelOrder('${r.id}')">取消订单</button>` : ""}
        ${r.status==="PAID" ? `<span class="muted">入住当天请带身份证到酒店前台办理入住</span>` : ""}
      </div>
    </div>`).join("") || `<p class="muted">这个状态下暂时没有订单。</p>`}
  </div>`;
}
function statusTimeline(r){
  const flow = ["UNPAID","PAID","CHECKED_IN","COMPLETED"];
  const idx = flow.indexOf(r.status);
  if(r.status==="CANCELLED" || r.status==="EXPIRED") return `<div class="timeline"><span class="tl-dot on">已下单</span><span class="tl-arrow">→</span><span class="tl-dot on">${STATUS[r.status].t}</span></div>`;
  return `<div class="timeline">${flow.map((s,i)=>`${i?'<span class="tl-arrow">→</span>':''}<span class="tl-dot ${i<=idx?'on':''}">${STATUS[s].t}</span>`).join("")}</div>`;
}
function viewOrderDetail(id){
  const r = resById(id);
  if(!r) return `<div class="card">订单不存在。</div>`;
  const u = me();
  if(!u || (u.id!==r.userId && u.role==="USER")) return `<div class="card">无权查看此订单。</div>`;
  const pays = DB.payments.filter(p=>p.reservationId===r.id);
  const rt0 = rtById(r.items[0].roomTypeId);
  return `
  <div class="card">
    <button class="btn light small" onclick="go('orders')">← 返回我的订单</button>
    <h2 style="margin-top:12px">订单 ${r.orderNo} <span class="badge ${STATUS[r.status].cls}">${STATUS[r.status].t}</span></h2>
    ${statusTimeline(r)}
    ${r.status==="UNPAID" ? `<p><span class="badge b-warn">${remainText(r)}，超时自动取消</span></p>` : ""}
    <dl class="kv" style="margin-top:10px">
      <dt>酒店 / 房型</dt><dd>${resTitle(r)}</dd>
      <dt>入住 / 离店</dt><dd>${r.checkIn} → ${r.checkOut}（${nightsBetween(r.checkIn, r.checkOut)} 晚）</dd>
      <dt>入住人</dt><dd>${esc(r.guestName)} · ${esc(r.guestPhone)}</dd>
      <dt>下单用户</dt><dd>${esc(userById(r.userId)?.name || "-")}</dd>
      <dt>房号</dt><dd>${r.assignedRoomId ? roomById(r.assignedRoomId)?.number + " 房" : "入住时由前台分配"}</dd>
      <dt>备注</dt><dd>${esc(r.remark) || "无"}</dd>
      ${r.pointsDiscount ? `<dt>积分抵扣</dt><dd style="color:#FA3E3E">-${money(r.pointsDiscount)}</dd>` : ""}
      <dt>订单总价</dt><dd style="color:#FA3E3E">${money(r.totalAmount)}</dd>
    </dl>
    <h3>支付记录</h3>
    ${pays.length ? `<table><tr><th>方式</th><th>金额</th><th>状态</th><th>流水号</th><th>时间</th></tr>
      ${pays.map(p=>`<tr><td>${p.method}</td><td>${money(p.amount)}</td><td>${p.status==="SUCCESS"?"支付成功":"已退款"}</td><td>${p.tradeNo}</td><td>${new Date(p.paidAt).toLocaleString("zh-CN")}</td></tr>`).join("")}</table>`
      : `<p class="muted">暂无支付记录。</p>`}
    <div class="actions">
      ${r.status==="UNPAID" ? `<button class="btn red" onclick="openPay('${r.id}')">立即支付</button>` : ""}
      ${["UNPAID","PAID"].includes(r.status) ? `<button class="btn danger" onclick="cancelOrder('${r.id}')">取消订单</button>` : ""}
      ${(u.role==="STAFF"||u.role==="ADMIN") && r.status==="PAID" ? `<button class="btn" onclick="go('pms')">去前台办理入住 →</button>` : ""}
      ${rt0 ? `<button class="btn light" onclick="go('detail','${rt0.hotelId}')">查看这家酒店</button>` : ""}
    </div>
    ${canReview(r) ? `
    <h3>评价这次入住</h3>
    <div class="form-grid">
      <label class="field">评分<select id="rev-rating-od">${[5,4,3,2,1].map(n=>`<option value="${n}">${n} 分</option>`).join("")}</select></label>
      <label class="field" style="grid-column:span 2">内容<input type="text" id="rev-content-od" placeholder="说说这次入住体验"></label>
    </div>
    <div class="actions"><button class="btn" onclick="addReview('${rt0.hotelId}','${r.id}')">发布点评</button></div>` : ""}
    ${r.status==="COMPLETED" && DB.reviews.some(x=>x.reservationId===r.id) ? `<p class="muted" style="margin-top:10px">✅ 已点评，感谢反馈。</p>` : ""}
  </div>`;
}
function openPay(id){
  const r = resById(id);
  openModal(`
    <h3>模拟支付 · ${money(r.totalAmount)}</h3>
    <p class="muted" style="margin-bottom:12px">演示版不会真实扣款，选择一种方式即可完成支付。</p>
    <label class="field">支付方式
      <select id="pay-method"><option>微信支付</option><option>支付宝</option><option>银行卡</option><option>美团支付</option></select>
    </label>
    <div class="actions">
      <button class="btn red" onclick="doPay('${id}')">确认支付 ${money(r.totalAmount)}</button>
      <button class="btn light" onclick="closeModal()">再想想</button>
    </div>`);
}
function doPay(id){
  const r = resById(id);
  if(r.status!=="UNPAID"){ toast("订单状态已变化，无法支付"); closeModal(); render(); return; }
  const method = $("#pay-method").value;
  DB.payments.push({ id:uid("p-"), reservationId:id, amount:r.totalAmount, method, status:"SUCCESS", tradeNo:uid("TRX").toUpperCase(), paidAt:Date.now() });
  r.status = "PAID"; r.paidAt = Date.now(); save(); closeModal();
  toast("支付成功，订单已确认");
  go("orderDetail", id);
}
function cancelOrder(id){
  const r = resById(id);
  if(!confirm(`确定取消订单 ${r.orderNo} 吗？${r.status==="PAID" ? "已支付金额将原路退回（模拟）。" : ""}取消后库存会立即释放。`)) return;
  if(r.assignedRoomId){ const rm = roomById(r.assignedRoomId); if(rm) rm.status = "DIRTY"; r.assignedRoomId = null; }
  if(r.status==="PAID"){
    DB.payments.filter(p=>p.reservationId===id && p.status==="SUCCESS").forEach(p=> p.status="REFUNDED");
  }
  r.status = "CANCELLED"; save(); toast("订单已取消"); render();
}

/* ============ 前台 PMS ============ */
let pmsHotel = "ALL";
function viewPms(){
  const u = me();
  if(!u || !(u.role==="STAFF" || u.role==="ADMIN")) return `<div class="card"><h2>前台 PMS</h2><p>该功能仅前台和管理员可用，请用 staff / admin 账号登录。</p><div class="actions"><button class="btn" onclick="go('login')">去登录</button></div></div>`;
  expireOrders();
  const t = todayStr(0);
  const inScope = r => pmsHotel==="ALL" || rtById(r.items[0].roomTypeId)?.hotelId===pmsHotel;
  const arrivals = DB.reservations.filter(r=>r.status==="PAID" && r.checkIn===t && inScope(r));
  const inHouse = DB.reservations.filter(r=>r.status==="CHECKED_IN" && inScope(r));
  const boardRooms = DB.rooms.filter(rm => pmsHotel==="ALL" || rtById(rm.roomTypeId)?.hotelId===pmsHotel);
  const cnt = s => boardRooms.filter(r=>r.status===s).length;
  return `
  <div class="card">
    <h2>前台工作台 · ${t}</h2>
    <label class="field" style="max-width:320px;margin-bottom:14px">选择酒店
      <select onchange="pmsHotel=this.value;render()">
        <option value="ALL" ${pmsHotel==="ALL"?"selected":""}>全部酒店</option>
        ${DB.hotels.map(h=>`<option value="${h.id}" ${pmsHotel===h.id?"selected":""}>${esc(h.name)}</option>`).join("")}
      </select>
    </label>
    <div class="stats">
      <div class="stat"><div class="num">${arrivals.length}</div><div class="lbl">今日待入住</div></div>
      <div class="stat"><div class="num">${inHouse.length}</div><div class="lbl">当前在住</div></div>
      <div class="stat"><div class="num">${cnt("VACANT")}</div><div class="lbl">空净房</div></div>
      <div class="stat"><div class="num">${cnt("DIRTY")}</div><div class="lbl">空脏待清洁</div></div>
      <div class="stat"><div class="num">${cnt("MAINTENANCE")}</div><div class="lbl">维修中</div></div>
    </div>
  </div>
  <div class="card">
    <h2>今日到店（办理入住）</h2>
    ${arrivals.map(r=>`<div class="order-card">
      <div class="order-head"><span class="order-no">${r.orderNo}</span><span class="badge b-info">${STATUS[r.status].t}</span></div>
      <div>${resTitle(r)} · ${esc(r.guestName)}（${esc(r.guestPhone)}）· 住 ${nightsBetween(r.checkIn, r.checkOut)} 晚 ${r.remark ? "· 备注：" + esc(r.remark) : ""}</div>
      <div class="actions"><button class="btn small" onclick="openCheckIn('${r.id}')">分配房间并入住</button>
      <button class="btn light small" onclick="go('orderDetail','${r.id}')">订单详情</button></div>
    </div>`).join("") || `<p class="muted">今天暂时没有待入住的订单。</p>`}
    <h3>当前在住（办理退房）</h3>
    ${inHouse.map(r=>`<div class="order-card">
      <div class="order-head"><span class="order-no">${r.orderNo}</span><span class="badge b-ok">已入住 · ${roomById(r.assignedRoomId)?.number || "?"} 房</span></div>
      <div>${resTitle(r)} · ${esc(r.guestName)} · ${r.checkIn} → ${r.checkOut}</div>
      <div class="actions"><button class="btn small" onclick="checkOut('${r.id}')">办理退房</button></div>
    </div>`).join("") || `<p class="muted">当前没有在住订单。</p>`}
  </div>
  <div class="card">
    <h2>房态看板（点任意房间可改状态）</h2>
    <div class="board">
      ${boardRooms.slice().sort((a,b)=>a.number-b.number).map(rm=>`<div class="cell st-${rm.status}" onclick="openRoomStatus('${rm.id}')">
        <div class="no">${rm.number}</div><div class="st">${ROOM_STATUS[rm.status]}</div><div class="tp">${esc(rtById(rm.roomTypeId)?.name || "")}</div>
      </div>`).join("")}
    </div>
    <p class="muted" style="margin-top:10px">空净 = 可售可入住；在住 = 已分配给在住订单；空脏 = 退房后待清洁；维修中 = 暂停售卖。</p>
  </div>`;
}
function openCheckIn(resId){
  const r = resById(resId);
  const typeId = r.items[0].roomTypeId;
  const free = DB.rooms.filter(rm=>rm.roomTypeId===typeId && rm.status==="VACANT");
  if(!free.length){ toast("该房型没有空净房了，请先在房态看板里把空脏房改为清洁完成"); return; }
  openModal(`
    <h3>办理入住 · ${r.orderNo}</h3>
    <p style="margin-bottom:10px">${resTitle(r)} · 入住人 ${esc(r.guestName)}${r.remark ? " · 备注：" + esc(r.remark) : ""}</p>
    <label class="field">选择空净房
      <select id="ci-room">${free.map(rm=>`<option value="${rm.id}">${rm.number} 房</option>`).join("")}</select>
    </label>
    <div class="actions"><button class="btn" onclick="doCheckIn('${resId}')">确认入住</button>
    <button class="btn light" onclick="closeModal()">取消</button></div>`);
}
function doCheckIn(resId){
  const r = resById(resId);
  const room = roomById($("#ci-room").value);
  if(!room || room.status!=="VACANT"){ toast("该房间状态已变化，请重新选择"); return; }
  r.assignedRoomId = room.id; r.status = "CHECKED_IN"; room.status = "OCCUPIED";
  save(); closeModal(); toast(`已入住：${room.number} 房`); go("pms");
}
function checkOut(resId){
  const r = resById(resId);
  if(!confirm(`给订单 ${r.orderNo} 办理退房？退房后房间变为「空脏待清洁」。`)) return;
  const room = roomById(r.assignedRoomId);
  if(room) room.status = "DIRTY";
  r.status = "COMPLETED"; save(); toast("退房完成，客人可在订单里点评了"); go("pms");
}
function openRoomStatus(roomId){
  const rm = roomById(roomId);
  if(rm.status==="OCCUPIED"){ toast("在住房间不能直接改状态，请先为对应订单办理退房"); return; }
  openModal(`
    <h3>${rm.number} 房 · ${esc(rtById(rm.roomTypeId)?.name || "")}</h3>
    <p style="margin-bottom:10px">当前状态：<b>${ROOM_STATUS[rm.status]}</b></p>
    <label class="field">改为
      <select id="rs-status">
        ${Object.entries(ROOM_STATUS).filter(([k])=>k!=="OCCUPIED").map(([k,v])=>`<option value="${k}" ${rm.status===k?"selected":""}>${v}</option>`).join("")}
      </select>
    </label>
    <div class="actions"><button class="btn" onclick="doRoomStatus('${roomId}')">保存</button>
    <button class="btn light" onclick="closeModal()">取消</button></div>`);
}
function doRoomStatus(roomId){
  const rm = roomById(roomId);
  rm.status = $("#rs-status").value; save(); closeModal(); toast("房态已更新"); go("pms");
}

/* ============ 管理后台 ============ */
function syncRooms(rt){
  const mine = DB.rooms.filter(r=>r.roomTypeId===rt.id);
  if(mine.length < rt.totalRooms){
    let maxNo = mine.length ? Math.max(...mine.map(r=>r.number)) : 9000 + DB.rooms.length;
    for(let i=mine.length;i<rt.totalRooms;i++){
      maxNo += 1;
      DB.rooms.push({ id:uid("room-"), roomTypeId:rt.id, number:maxNo, status:"VACANT" });
    }
  } else if(mine.length > rt.totalRooms){
    let need = mine.length - rt.totalRooms;
    for(let i=mine.length-1;i>=0 && need>0;i--){
      if(mine[i].status==="VACANT"){ DB.rooms = DB.rooms.filter(r=>r.id!==mine[i].id); need--; }
    }
    if(need>0){ rt.totalRooms = DB.rooms.filter(r=>r.roomTypeId===rt.id).length; toast("有房间在住/维修，间数只能先减到 " + rt.totalRooms); }
  }
}
function viewAdmin(){
  const u = me();
  if(!u || u.role!=="ADMIN") return `<div class="card"><h2>管理后台</h2><p>该功能仅管理员可用，请用 admin 账号登录。</p><div class="actions"><button class="btn" onclick="go('login')">去登录</button></div></div>`;
  expireOrders();
  const revenue = DB.payments.filter(p=>p.status==="SUCCESS").reduce((s,p)=>s+p.amount,0);
  const refunded = DB.payments.filter(p=>p.status==="REFUNDED").reduce((s,p)=>s+p.amount,0);
  const totalRoomsAll = DB.roomTypes.reduce((s,r)=>s+r.totalRooms,0);
  const occupiedTonight = DB.roomTypes.reduce((s,rt)=> s + bookedOn(rt.id, todayStr(0), null), 0);
  const occRate = totalRoomsAll ? Math.round(occupiedTonight/totalRoomsAll*100) : 0;
  return `
  <div class="card">
    <h2>平台经营概览</h2>
    <div class="stats">
      <div class="stat"><div class="num">${DB.hotels.length}</div><div class="lbl">入驻酒店</div></div>
      <div class="stat"><div class="num">${DB.reservations.length}</div><div class="lbl">订单总数</div></div>
      <div class="stat"><div class="num">${money(revenue)}</div><div class="lbl">已收款（未扣退款）</div></div>
      <div class="stat"><div class="num">${money(refunded)}</div><div class="lbl">已退款</div></div>
      <div class="stat"><div class="num">${occRate}%</div><div class="lbl">今晚入住率（${occupiedTonight}/${totalRoomsAll} 间）</div></div>
      <div class="stat"><div class="num">${DB.users.length}</div><div class="lbl">注册用户</div></div>
    </div>
  </div>
  <div class="card">
    <h2>酒店与房型管理</h2>
    <table>
      <tr><th>酒店</th><th>房型</th><th>价格/晚（划线）</th><th>间数</th><th>可住</th><th>状态</th><th>操作</th></tr>
      ${DB.roomTypes.map(rt=>`<tr>
        <td>${esc(hotelOfRt(rt).name.replace("酒店","酒店"))}</td><td>${esc(rt.name)}</td>
        <td>${money(rt.price)}（${money(rt.origPrice)}）</td><td>${rt.totalRooms}</td><td>${rt.capacity} 人</td>
        <td>${rt.active ? '<span class="badge b-ok">在售</span>' : '<span class="badge b-grey">已下架</span>'}</td>
        <td><button class="btn light small" onclick="openEditType('${rt.id}')">编辑</button>
            <button class="btn light small" onclick="toggleType('${rt.id}')">${rt.active ? "下架" : "上架"}</button></td>
      </tr>`).join("")}
    </table>
    <div class="actions"><button class="btn" onclick="openAddType()">＋ 新增房型</button></div>
  </div>
  <div class="card">
    <h2>全部订单</h2>
    <table>
      <tr><th>订单号</th><th>客人</th><th>酒店 / 房型</th><th>入住 → 离店</th><th>金额</th><th>状态</th><th></th></tr>
      ${DB.reservations.slice().reverse().map(r=>`<tr>
        <td>${r.orderNo}</td><td>${esc(r.guestName)}</td><td>${resTitle(r)}</td>
        <td>${r.checkIn} → ${r.checkOut}</td><td>${money(r.totalAmount)}</td>
        <td><span class="badge ${STATUS[r.status].cls}">${STATUS[r.status].t}</span></td>
        <td><button class="btn light small" onclick="go('orderDetail','${r.id}')">详情</button></td>
      </tr>`).join("")}
    </table>
  </div>
  <div class="card">
    <h2>用户管理</h2>
    <table>
      <tr><th>账号</th><th>姓名</th><th>手机号</th><th>角色</th></tr>
      ${DB.users.map(x=>`<tr><td>${esc(x.username)}</td><td>${esc(x.name)}</td><td>${esc(x.phone)}</td>
        <td><span class="badge ${x.role==="USER"?"b-grey":"b-info"}">${{USER:"普通用户",STAFF:"前台",ADMIN:"管理员"}[x.role]}</span></td></tr>`).join("")}
    </table>
  </div>`;
}
function toggleType(id){ const rt = rtById(id); rt.active = !rt.active; save(); toast(rt.active ? "已上架" : "已下架"); go("admin"); }
function typeForm(rt){
  return `
  <div class="form-grid">
    ${rt ? "" : `<label class="field">所属酒店<select id="tf-hotel">${DB.hotels.map(h=>`<option value="${h.id}">${esc(h.name)}</option>`).join("")}</select></label>`}
    <label class="field">房型名称<input type="text" id="tf-name" value="${rt ? esc(rt.name) : ""}" placeholder="如：影院大床房"></label>
    <label class="field">价格（元/晚）<input type="number" id="tf-price" min="1" value="${rt ? rt.price : 199}"></label>
    <label class="field">划线价（元/晚）<input type="number" id="tf-orig" min="1" value="${rt ? rt.origPrice : 399}"></label>
    <label class="field">房间总数<input type="number" id="tf-total" min="1" value="${rt ? rt.totalRooms : 3}"></label>
    <label class="field">可住人数<input type="number" id="tf-cap" min="1" value="${rt ? rt.capacity : 2}"></label>
    <label class="field">面积（㎡）<input type="number" id="tf-area" min="1" value="${rt ? rt.area : 32}"></label>
    <label class="field">床型<input type="text" id="tf-bed" value="${rt ? esc(rt.bed) : "1.8m 大床"}"></label>
  </div>`;
}
function openEditType(id){ const rt = rtById(id); openModal(`<h3>编辑房型 · ${esc(rt.name)}</h3>${typeForm(rt)}
  <div class="actions"><button class="btn" onclick="saveType('${id}')">保存</button><button class="btn light" onclick="closeModal()">取消</button></div>`); }
function openAddType(){ openModal(`<h3>新增房型</h3>${typeForm(null)}
  <div class="actions"><button class="btn" onclick="saveType(null)">创建</button><button class="btn light" onclick="closeModal()">取消</button></div>`); }
function saveType(id){
  const name = $("#tf-name").value.trim();
  const price = Number($("#tf-price").value), orig = Number($("#tf-orig").value), total = Number($("#tf-total").value), cap = Number($("#tf-cap").value);
  if(!name || !(price>0) || !(total>0) || !(cap>0)){ toast("名称、价格、间数、人数都要填对"); return; }
  const data = { name, price, origPrice: orig>0?orig:price, totalRooms: total, capacity: cap, area: Number($("#tf-area").value)||30, bed: $("#tf-bed").value.trim()||"大床" };
  if(id){ Object.assign(rtById(id), data); syncRooms(rtById(id)); }
  else {
    const rt = { id:uid("rt-"), hotelId: $("#tf-hotel").value, ...data, amenities:["免费WiFi","空调"], active:true };
    DB.roomTypes.push(rt); syncRooms(rt);
  }
  save(); closeModal(); toast("房型已保存"); go("admin");
}

/* ============ 登录 / 注册 ============ */
function viewLogin(){
  return `
  <div class="card auth-wrap">
    <h2>登录</h2>
    <div class="form-grid" style="grid-template-columns:1fr">
      <label class="field">账号<input type="text" id="li-user" placeholder="演示账号见下方一键登录"></label>
      <label class="field">密码<input type="password" id="li-pwd" placeholder="密码"></label>
    </div>
    <div class="actions"><button class="btn" onclick="doLogin()">登录</button>
    <button class="btn light" onclick="go('register')">没有账号？去注册</button></div>
    <h3>一键登录（演示账号）</h3>
    <div class="quick">
      <button class="btn light small" onclick="quickLogin('guest')">👤 普通用户 guest / user123</button>
      <button class="btn light small" onclick="quickLogin('staff')">🛎️ 前台 staff / staff123</button>
      <button class="btn light small" onclick="quickLogin('admin')">⚙️ 管理员 admin / admin123</button>
    </div>
  </div>`;
}
function afterLogin(u){
  toast(`欢迎回来，${u.name}`);
  if(u.role==="ADMIN") go("admin"); else if(u.role==="STAFF") go("pms"); else go("orders");
}
function doLogin(){
  const un = $("#li-user").value.trim(), pw = $("#li-pwd").value;
  const u = DB.users.find(x=>x.username===un && x.password===pw);
  if(!u){ toast("账号或密码不正确"); return; }
  setSession(u.id); afterLogin(u);
}
function quickLogin(un){
  const u = DB.users.find(x=>x.username===un);
  setSession(u.id); afterLogin(u);
}
function viewRegister(){
  return `
  <div class="card auth-wrap">
    <h2>注册新账号</h2>
    <div class="form-grid" style="grid-template-columns:1fr">
      <label class="field">账号<input type="text" id="rg-user" placeholder="字母/数字，登录用"></label>
      <label class="field">密码<input type="password" id="rg-pwd" placeholder="至少 6 位"></label>
      <label class="field">姓名<input type="text" id="rg-name" placeholder="真实姓名"></label>
      <label class="field">手机号<input type="tel" id="rg-phone" placeholder="11 位手机号"></label>
    </div>
    <div class="actions"><button class="btn" onclick="doRegister()">注册并登录</button>
    <button class="btn light" onclick="go('login')">已有账号？去登录</button></div>
  </div>`;
}
function doRegister(){
  const un = $("#rg-user").value.trim(), pw = $("#rg-pwd").value, name = $("#rg-name").value.trim(), phone = $("#rg-phone").value.trim();
  if(!un || pw.length < 6){ toast("账号不能为空，密码至少 6 位"); return; }
  if(DB.users.some(x=>x.username===un)){ toast("这个账号已被注册，换一个"); return; }
  if(!name || !/^1\d{10}$/.test(phone)){ toast("请填写姓名和正确的 11 位手机号"); return; }
  const u = { id:uid("u-"), username:un, password:pw, name, phone, role:"USER" };
  DB.users.push(u); save(); setSession(u.id); afterLogin(u);
}

/* ============ 启动 ============ */
expireOrders();
render();
setInterval(()=>{ expireOrders(); if(["orders","orderDetail"].includes(view)) render(); }, 30000);
</script>
